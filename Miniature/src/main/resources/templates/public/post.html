<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dettaglio Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fafafa;
        }

        h1, h2, h3, h4 { color: #111; margin-top: 0; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }

        /* Elementi generici */
        .box {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            margin-bottom: 20px;
        }
        .text-muted { color: #666; font-size: 0.9em; }
        
        /* Autore e Commenti */
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        /* Gallery - FOTO INTERE */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .gallery img { 
            width: 100%; 
            height: auto; /* Rimuove il blocco fisso verticale */
            max-height: 450px; /* Impedisce che foto giganti occupino tre schermate */
            object-fit: contain; /* Forza la visualizzazione della foto intera senza tagli */
            background-color: #f0f0f0; /* Crea uno sfondo neutro se la foto è verticale o stretta */
            border: 1px solid #ddd; 
            border-radius: 4px;
        }

        /* Prodotto Originale - FOTO INTERA */
        .prodotto { display: flex; gap: 20px; align-items: center; border: 1px solid #ddd; padding: 15px; background: #fff; }
        .prodotto img { width: 140px; height: 140px; object-fit: contain; }

        /* Pulsanti normali */
        .btn-group { display: flex; gap: 10px; margin: 15px 0; }
        button, .btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 16px;
            cursor: pointer;
            color: #333;
            font-size: 14px;
        }
        button:hover, .btn:hover { background: #e5e5e5; }
        .btn-danger { background: #fff5f5; color: #cc0000; border-color: #ffa3a3; }
        .btn-danger:hover { background: #ffe3e3; }

        /* Lista commenti */
        .commento-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .commento-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="box">
        <h1 th:text="${post.titolo}">Titolo post</h1>
        
        <div class="user-info" th:if="${post.utente != null}">
            <a th:href="@{'/profilo/' + ${post.utente.id}}" class="user-info">
                <img th:src="${post.utente.urlFotoProfilo != null ? post.utente.urlFotoProfilo : '/img/default-avatar.png'}" alt="avatar" class="avatar">
                <div>
                    <span style="font-weight: bold;" th:text="${post.utente.credenziali != null ? post.utente.credenziali.username : 'Utente sconosciuto'}">Username</span>
                    <br><span class="text-muted" th:text="${post.data}">Data</span>
                </div>
            </a>
        </div>

        <p style="margin-top: 20px; white-space: pre-wrap;" th:text="${post.descrizione}">Descrizione del post</p>
    </div>

    <div class="box">
        <h3>Immagini</h3>
        <div th:if="${post.immagini == null || #lists.isEmpty(post.immagini)}" class="text-muted">Nessuna immagine disponibile</div>
        <div class="gallery" th:if="${post.immagini != null and !#lists.isEmpty(post.immagini)}">
            <div th:each="immagine : ${post.immagini}" th:if="${immagine != null and immagine.url != null}">
                <img th:src="@{'/uploads/' + ${immagine.url}}" alt="Immagine">
            </div>
        </div>
    </div>

    <div class="box" th:if="${post.prodottoOriginale != null}">
        <h3>Prodotto Originale</h3>
        <div class="prodotto">
            <img th:src="${post.prodottoOriginale.immagineUrl}" alt="prodotto">
            <div>
                <h4 style="margin-bottom:5px;" th:text="${post.prodottoOriginale.nome}">Nome</h4>
                <p class="text-muted" style="margin:0;" th:text="${post.prodottoOriginale.categoria}">Categoria</p>
                <p th:text="${#strings.abbreviate(post.prodottoOriginale.descrizione, 120)}">Descrizione</p>
                <a th:href="${post.prodottoOriginale.storeUrl}" target="_blank" class="btn">Vai allo store</a>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <form th:action="@{'/post/' + ${post.id} + '/upVote'}" method="post">
            <button type="submit">👍 Mi piace</button>
        </form>

        <form th:action="@{'/post/delete/' + ${post.id}}" method="post" th:if="${utenteLoggato != null and utenteLoggato.id == post.utente.id}">
            <button type="submit" class="btn-danger">Elimina</button>
        </form>

        <form th:action="@{'/post/delete/' + ${post.id}}" method="post" sec:authorize="hasRole('ROLE_ADMIN')">
            <button type="submit" class="btn-danger">Elimina (Admin)</button>
        </form>
    </div>

    <div class="box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Commenti</h3>
            <a th:href="@{'/user/' + ${post.id} + '/commentoForm'}" class="btn">Aggiungi Commento</a>
        </div>

        <div th:if="${commenti == null || commenti.isEmpty()}" class="text-muted">Nessun commento presente.</div>

        <div th:if="${commenti != null and !commenti.isEmpty()}">
            <div th:each="commento : ${commenti}" class="commento-item">
                <div class="user-info" th:if="${commento.utente != null}">
                    <img th:src="${commento.utente.urlFotoProfilo != null ? commento.utente.urlFotoProfilo : '/img/default-avatar.png'}" alt="avatar" class="avatar" style="width:30px; height:30px;">
                    <a th:href="@{'/profilo/' + ${commento.utente.id}}" style="font-weight:bold; font-size:14px;" th:text="${commento.utente.credenziali != null ? commento.utente.credenziali.username : 'Utente sconosciuto'}">Username</a>
                    <span class="text-muted" style="font-size:12px;" th:text="${commento.data}">Data</span>
                </div>
                <h4 style="margin: 10px 0 5px 0;" th:text="${commento.titolo}">Titolo</h4>
                <p style="margin: 0;" th:text="${commento.testo}">Testo</p>
            </div>
        </div>
    </div>

    <div style="margin-bottom: 40px;">
        <a href="/" class="btn">← Torna indietro</a>
    </div>

</body>
</html>
