<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrati</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #f0f0f0; border: 1px solid #ccc; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #e5e5e5; }
        .error-message { color: #cc0000; font-size: 14px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Registrati</h1>

    <form th:action="@{/register}" method="post" th:object="${credenziali}">
        
        <div th:if="${#fields.hasGlobalErrors()}" class="error-message">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" th:field="*{username}" required />
            <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}" required />
            <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" th:field="*{password}" required />
            <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="role">Ruolo:</label>
            <select th:field="*{role}" required>
                <option value="ROLE_USER">USER</option>
                <option value="ROLE_ADMIN">ADMIN</option>
            </select>
        </div>

        <button type="submit">Registrati</button>
    </form>

    <div style="margin-top: 20px;">
        <a href="/login">Hai già un account? Accedi!</a><br>
        <a href="/">Continua come ospite</a>
    </div>

</body>
</html>
