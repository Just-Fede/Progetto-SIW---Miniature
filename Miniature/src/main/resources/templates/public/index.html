<!DOCTYPE html>
<html>

<head>
	<Title>Post</Title>
</head>

<body>
	<h1><a href="/login">Login </a></h1>

	<span sec:authorize="isAuthenticated()">
		<h1>
			<a th:href="@{'/profilo/' + ${utente.id}}">
				Profilo personale
			</a>
		</h1>
	</span>

	<span sec:authorize="isAuthenticated()">
		<h1> <a href="/post/create">
				Crea un nuovo post
			</a>
		</h1>
	</span>

	<hr>

<h2>
    Post recenti:
    <span th:text="${posts.size()}"></span>
</h2>

	<div th:if="${posts == null || posts.isEmpty()}">
		<p>Nessun post disponibile.</p>
	</div>

<div th:each="post : ${posts}" style="border:1px solid #ccc; padding:10px; margin:10px;">

    <h3 th:text="${post.titolo}">Titolo post</h3>

    <p th:text="${post.descrizione}">Descrizione</p>

    <div th:if="${!#lists.isEmpty(post.immagini)}">
        <img th:src="${post.immagini[0].url}"
             style="max-width:200px;" />
    </div>

    <small>
        Data:
        <span th:text="${post.data}"></span>
    </small>

    <br>

    <a th:href="@{'/post/' + ${post.id}}">
        Vai al post
    </a>

</div>

</body>

</html>
