<!DOCTYPE html>
<html>

<head>
	<Title>Post</Title>
</head>

<body>

	<span sec:authorize="!isAuthenticated()">
		<h1><a href="/login">Login </a></h1>
	</span>

	<span sec:authorize="isAuthenticated()">
		<h1>
			<a th:href="@{'/profilo/' + ${utente.id}}">
				Profilo personale
			</a>
		</h1>

		<h1> <a href="/post/create">
				Crea un nuovo post
			</a>
		</h1>

		<a href="/logout">Logout</a>

	</span>

	<span sec:authorize="hasRole('ROLE_ADMIN')">
		<h1>
			<a href="/admin/index"> Area Admin </a>
		</h1>
	</span>

	<hr>

	<h2>
		Post recenti:
		<span th:text="${posts.size()}"></span>
	</h2>

	<div th:if="${posts == null || posts.isEmpty()}">
		<p>Nessun post disponibile.</p>
	</div>

	<div th:each="post : ${posts}" style="border:1px solid #ccc; padding:10px; margin:10px;">

		<!-- AUTORE -->
		<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">

			<img th:src="${post.utente != null && post.utente.urlFotoProfilo != null 
                        ? post.utente.urlFotoProfilo 
                        : '/img/default-avatar.png'}" alt="avatar"
				style="width:35px; height:35px; border-radius:50%; object-fit:cover;">

			<span style="font-weight:bold;" th:text="${post.utente != null && post.utente.credenziali != null 
                  ? post.utente.credenziali.username 
                  : 'Utente sconosciuto'}">
			</span>

		</div>

		<!-- CONTENUTO POST -->
		<h3 th:text="${post.titolo}">Titolo post</h3>

		<p th:text="${post.descrizione}">Descrizione</p>

		<div th:if="${post.immagini != null and !#lists.isEmpty(post.immagini)}">
			<img th:src="@{'/uploads/' + ${post.immagini[0].url}}" style="max-width:200px;" />
		</div>

		<small>
			Data:
			<span th:text="${post.data}"></span>
		</small>

		<br><br>

		<a th:href="@{'/post/' + ${post.id}}">
			Vai al post
		</a>

		<form th:action="@{'/post/' + ${post.id} + '/upVote'}" method="post">
			<button type="submit">
				❤️ [[${#lists.size(post.upVotes)}]]
			</button>
		</form>

	</div>

</body>

</html>
