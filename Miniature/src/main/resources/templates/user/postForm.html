<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Post</title>
</head>

<body>
    <h1>Crea un nuovo post</h1>
    <form   th:action="@{/post/create}" 
            method="post"
            enctype="multipart/form-data">

        <label for="title">Titolo:</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <label for="content">Contenuto:</label><br>
        <textarea id="content" name="content" rows="4" cols="50" required></textarea><br><br>

        <label for="prodottoOriginale">Prodotto Originale:</label>
        <select th:field="*{prodottiOriginali}">
            <option value="" disabled selected>Seleziona prodotto originale</option>
            <option th:each="p : ${prodottiOriginali}"
                    th:value="${p.id}"
                    th:text="${p.nome}">
            </option>
        </select><br><br>

        <label for="immagini">Immagine Copertina:</label>
        <input type="file" id="immagini" name="immagini" required><br><br>

        <label for="altreImmagini">Altre Immagini:</label>
        <input type="file" id="altreImmagini" name="altreImmagini" multiple><br><br>

        <input type="submit" value="Crea Post">
    </form>
</body>

</html>
