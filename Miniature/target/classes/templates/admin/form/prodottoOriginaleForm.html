<form th:action="@{/admin/form/prodottoOriginaleForm}" method="post">

    <div>
        <label>Nome</label>
        <input type="text" name="nome" required>
    </div>

    <div>
        <label>Descrizione</label>
        <input type="text" name="descrizione" required>
    </div>

    <div>
        <label>Categoria</label>
        <input type="text" name="categoria" required>
    </div>

    <div>
        <label>Store URL</label>
        <input type="text" name="storeUrl" required>
    </div>

    <div>
        <label>Immagine URL</label>
        <input type="text" name="immagineUrl" required>
    </div>

    <button type="submit">Salva</button>
    <a th:href="@{/}">torna al menu </a>
</form>
