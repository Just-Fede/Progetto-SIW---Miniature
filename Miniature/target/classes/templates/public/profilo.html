<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profilo Utente</title>
    
    <style>
        /* Questo CSS si adatta al tuo HTML originale senza modifiche alla struttura */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Foto profilo */
        .profile-image img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #764ba2;
            display: block;
            margin-bottom: 1rem;
        }

        /* Dati utente */
        .container p {
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .container p strong {
            color: #764ba2;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 2rem 0;
        }

        /* Griglia dei Post */
        .posts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .post-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
        }

        .post-card h3 {
            margin-bottom: 0.5rem;
            color: #2d3748;
        }

        .post-card p {
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 0.8rem;
        }

        .post-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.8rem;
        }

        .post-card small {
            color: #a0aec0;
            display: block;
        }

        /* Link in fondo */
        a {
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
            margin-right: 1.5rem;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="profile-image">
        <img th:src="@{${utente.urlFotoProfilo}}" alt="Foto profilo" />
    </div>
    <div class="container">
        <p><span th:text="${utente.credenziali.username}">Username</span></p>
        <p>Biografia: <span th:text="${utente.bio}">Biografia</span></p>
        <p>Data di Registrazione: <span th:text="${utente.dataRegistrazione}">Data di Registrazione</span></p>
        <p>Post Pubblicati:<span th:text="${utente.posts.size()}"></span></p>
        <p><strong>Email:</strong> <span th:text="${utente.credenziali.email}">Email Utente</span></p>
    </div>

    <hr>

    <div class="posts-container">

        <div th:if="${utente.posts == null || utente.posts.isEmpty()}">
            Nessun post pubblicato.
        </div>

        <div th:each="post : ${utente.posts}" class="post-card">

            <a th:href="@{'/post/' + ${post.id}}" style="text-decoration:none; color:inherit;">

                <h3 th:text="${post.titolo}"></h3>

                <p th:text="${post.descrizione}"></p>

                <div th:if="${post.immagini != null and !#lists.isEmpty(post.immagini)}">
                    <img th:src="@{'/uploads/' + ${post.immagini[0].url}}">
                </div>

                <small th:text="${post.data}"></small>

            </a>

        </div>

    </div>

    <hr>

    <a th:if="${utenteLoggato != null and utenteLoggato.id == utente.id}"
        th:href="@{'/utente/' + ${utente.id} + '/form'}">
        Modifica profilo
    </a>

    <a href="/">Torna alla Home</a>

</body>

</html>
