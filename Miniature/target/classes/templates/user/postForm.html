<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Post</title>
    <style>
        /* --- LOOK CHIARO & MINIMALE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #1a1a1a;
            font-size: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 12px;
        }

        form {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            color: #6b6b6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* INPUT CHIARI CON BORDO SOTTILE */
        input[type="text"], select, textarea, input[type="file"] {
            background: #ffffff;
            border: 1px solid #d4d4d4;
            padding: 12px;
            color: #1a1a1a;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #1a1a1a;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #a3a3a3;
        }

        textarea { height: 100px; resize: none; }

        /* BOTTONE MINIMALE */
        button {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 10px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        button:hover { background: #333333; }

        a {
            color: #6b6b6b;
            text-decoration: none;
            margin-top: 25px;
            font-size: 0.85rem;
        }
        a:hover { color: #1a1a1a; }
    </style>
</head>

<body>

    <h1>Crea Nuovo Post</h1>

    <form th:action="@{/post/create}" method="post" enctype="multipart/form-data">

        <div class="field">
            <label>Titolo del post</label>
            <input type="text" name="titolo" required placeholder="...">
        </div>

        <div class="field">
            <label>Contenuto / Descrizione</label>
            <textarea name="descrizione" required placeholder="..."></textarea>
        </div>

        <div class="field">
            <label>Prodotto Originale</label>
            <select name="prodottoId">
                <option value="" disabled selected>Scegli modello</option>
                <option th:each="p : ${prodottiOriginali}" th:value="${p.id}" th:text="${p.nome}"></option>
            </select>
        </div>

        <div class="field">
            <label>Immagine Copertina</label>
            <input type="file" name="copertina" required>
        </div>

        <div class="field">
            <label>Altre Immagini</label>
            <input type="file" name="altreImmagini" multiple>
        </div>

        <button type="submit">Pubblica Post</button>
    </form>

    <a href="/">Torna alla Home</a>

</body>
</html>
