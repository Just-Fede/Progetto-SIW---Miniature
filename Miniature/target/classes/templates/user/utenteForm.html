<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica Profilo</title>
    <style>
        /* --- STILE SIMPLE & CHILL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        h2 {
            margin-bottom: 20px;
            color: #2d3748;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #4a5568;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Modifica Profilo</h2>
        <p th:if="${erroreUsername}" style="color:red;" th:text="${erroreUsername}"></p>
        <form th:action="@{'/utente/' + ${utente.id} + '/form'}" th:object="${utente}" method="post" enctype="multipart/form-data">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" th:value="*{credenziali != null ? credenziali.username : ''}" required>
            </div>

            <div class="form-group">
                <label for="bio">Biografia</label>
                <textarea id="bio" th:field="*{bio}" rows="4" placeholder="Scrivi qualcosa su di te..."></textarea>
            </div>

            <div class="form-group">
                <label for="fileFoto">Foto profilo</label>
                <input type="file" id="fileFoto" name="fileFoto">
            </div>

            <button type="submit">Salva modifiche</button>
        </form>
    </div>

</body>
</html>
